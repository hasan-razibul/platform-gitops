apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/hasan-razibul/platform-gitops.git
    targetRevision: main
    path: applications/payments-api

  destination:
    server: https://kubernetes.default.svc
    namespace: payments

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true